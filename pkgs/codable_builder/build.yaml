targets:
  $default:
    builders:
      codable_builder|codable:
        enabled: true
      source_gen|combining_builder:
        options:
          ignore_for_file:
            - lines_longer_than_80_chars
            - unnecessary_lambdas
            - deprecated_member_use
            - unused_element

builders:
  codable:
    import: "package:codable_builder/builder.dart"
    builder_factories: ["codableBuilder"]
    build_extensions: {".dart": [".codable.g.part"]}
    auto_apply: dependents
    build_to: cache
    applies_builders: ["source_gen|combining_builder"]
