# Tests tagged `native-sdk` need the private json-utf8 Dart SDK build and are
# skipped by default. Enable them with `dart test -P native` (see
# tool/native_sdk_check.dart for SDK discovery).
tags:
  native-sdk:
    skip: Requires the private json-utf8 SDK; run with `dart test -P native`.

presets:
  native:
    tags:
      native-sdk:
        skip: false
