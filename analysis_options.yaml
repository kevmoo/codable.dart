include: package:dart_flutter_team_lints/analysis_options.yaml

analyzer:
  exclude:
    - pkgs/codable_benchmarks/benchmark/data/embedded_datasets.dart
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - empty_container_bodies
    - initialize_in_field_declaration
    - unnecessary_const_in_enum_constructor
    - unnecessary_primary_constructor_body
    - use_declaring_parameters
    - simple_directive_paths
    - unnecessary_ignore
    # Blocked on https://github.com/dart-lang/source_gen/issues/821
    # - unnecessary_type_name_in_constructor
    # - use_primary_constructors
